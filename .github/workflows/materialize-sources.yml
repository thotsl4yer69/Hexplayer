name: Materialize staged sources
on:
  push:
    branches: [feature/android-controller]
    paths:
      - 'staging/**'
      - '.github/workflows/materialize-sources.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/mazlabz/hexplayer
          gzip -dc staging/hexplayer.py.gz > hexplayer.py
          gzip -dc staging/MainActivity.kt.gz > android/app/src/main/java/com/mazlabz/hexplayer/MainActivity.kt
          rm -rf staging
          rm -f .github/workflows/materialize-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: materialize Android controller sources"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
