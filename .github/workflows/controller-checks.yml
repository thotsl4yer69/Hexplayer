name: Controller checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests python-dotenv spotipy
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile hexplayer.py register.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require the runner's installed Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-36" && test -d "$ANDROID_HOME/build-tools/36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android
        env:
          HEXPLAYER_BUILD_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: hexplayer-debug-test-signed
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
